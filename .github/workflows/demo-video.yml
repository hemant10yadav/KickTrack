name: Demo Video

on:
  workflow_dispatch:
    inputs:
      clip:
        description: "Fixture clip to render (under tests/videos/)"
        required: false
        default: "match_5.mp4"
        type: choice
        options:
          - match_3.mp4
          - match_4.mp4
          - match_5.mp4

concurrency:
  group: demo-video-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install dependencies
        run: uv sync

      - name: Export CoreML model
        # Matches the rect imgsz INFERENCE_IMGSZ uses in scripts/pipeline.py — see
        # CLAUDE.md's "Rectangular imgsz" section for why this shape was chosen.
        run: |
          uv run python -c "
          from ultralytics import YOLO
          model = YOLO('yolov8s.pt')
          model.export(format='coreml', imgsz=(640, 1152), half=True)
          "

      - name: Render tracked demo clip
        run: |
          uv run python -m scripts.track_players \
            "tests/videos/${{ inputs.clip }}" \
            --output raw_demo.mp4

      - name: Re-encode for browser playback
        # cv2.VideoWriter's mp4v (MPEG-4 Part 2) fourcc isn't broadly playable in
        # browsers; re-encode to H.264 so the README-embedded <video> tag works.
        run: |
          ffmpeg -y -i raw_demo.mp4 -vcodec libx264 -crf 26 -pix_fmt yuv420p demo.mp4

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view demo-latest >/dev/null 2>&1; then
            gh release upload demo-latest demo.mp4 --clobber
          else
            gh release create demo-latest demo.mp4 \
              --title "Latest tracking demo" \
              --notes "Auto-generated by the Demo Video workflow. Re-run it from the Actions tab to refresh."
          fi
