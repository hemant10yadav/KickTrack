name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # TODO: move to ubuntu-latest once the CoreML-only dependency (coremltools,
  # pinned via tool.uv.environments = ["sys_platform == 'darwin'"] in
  # pyproject.toml) is no longer a hard requirement for import/test collection.
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -m "not slow"
