[project]
name = "kicktrack"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "ultralytics==8.4.148",
    "opencv-python==5.0.0.93",
    "lap==0.5.13",
    "coremltools>=9.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "matplotlib>=3.11.1",
    "pyyaml>=6.0.3",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.7",
    "prek==0.5.2",
    "pytest==9.0.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["scripts/pnlcalib"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: runs the real CoreML pipeline against a fixture video; opt-in via `-m slow`",
]

[tool.uv]
environments = ["sys_platform == 'darwin'"]
